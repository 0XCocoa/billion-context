name: Bugfix Release (carve-out)

# Dedicated emergency / hotfix publish channel (#2011), PR-gated since #2851.
#
# Publishes a version cut from a NON-master ref -- e.g. a released tag plus
# fixes -- STRICTLY excluding the unreleased work that has since accumulated
# on master. First used for the v0.1.182 emergency: ship ONLY the integer
# max_tokens fix without dragging in the ~70 commits already merged to
# master after v0.1.181.
#
# MERGE-GATED LANE PUBLISH (v2 model, 2026-10-25; SUPERSEDES the backport-ship
# label path from #4596 -- a label publishes without a human merge decision
# and is deliberately gone now):
#   - A patch lane (bugfix-v*) is cut from the latest released TAG and is a
#     PROTECTED branch with the same status as master (PR-only, required
#     checks, no force/delete). Every piece of content enters the lane
#     through a reviewed PR -- there is no other way.
#   - When such a PR MERGES into the lane, THIS workflow fires (the
#     `pull_request_target` closed trigger below; GitHub runs the lane-side
#     copy of this file against the base ref) and publishes the POST-MERGE
#     LANE HEAD (= the merge sha) -- exactly the reviewed state of the lane,
#     nothing else. The human MERGE BUTTON IS THE RELEASE TRIGGER: no label,
#     no direct push, no silent auto-publish.
#   - Right after a successful publish the workflow AUTO-OPENS an alignment
#     PR (lane -> master) so master picks up the shipped content. It
#     structurally conflicts (master evolved past the older tag); resolve
#     master-first, keeping only lane-unique content. Merging it closes the
#     release cycle.
#   - The target version lives in the LANE's package.json (bumped when the
#     lane was cut), so the guards below enforce monotonicity without any
#     further input.
#   - Emergency escape hatch: manual workflow_dispatch with the `fast` input
#     (owner-owned risk; skips the full-CI lanes + the full npm test, keeps
#     every version guard + npm ci + typecheck + build).
#
# LEGACY path (kept dormant): the original `pull_request` closed trigger for
# bugfix-release/* one-off carve-outs PR'd AGAINST MASTER predates the lane
# model. It still works so an old in-flight carve-out can finish safely; new
# work must go through a protected lane.
#
# Unlike release.yml (which builds the POST-MERGE MASTER tree on
# push-to-master, so it can never exclude master's existing commits), this
# checks out and publishes the LANE HEAD tree itself -- the artifact is
# exactly that tree, nothing else.
#
# Guarded so it can never:
#   - move `latest` backwards (target must be strictly newer than npm latest);
#   - re-publish an already-live version;
#   - ship a sub-0.1.0 line (#1385);
#   - act on fork PRs (secrets unavailable) or on non-merged closes;
#   - publish anything but the reviewed post-merge lane head.
#
# Master interaction: the post-publish alignment PR brings the lane content
# (and the version bump) INTO master. Master's next normal release MUST be
# higher than the carved-out version -- the one-click bump derives from npm
# latest, so this holds automatically.

on:
  pull_request:
    types: [closed]
    branches: [master]
  pull_request_target:
    # v2 merge-gated lane publish: fires when a PR is CLOSED against a patch
    # lane; the resolve step no-ops within milliseconds on every close that
    # is not a MERGE into a bugfix-v* / bugfix-release/** lane. Runs the
    # BASE (lane-side) copy of this workflow with secrets; the resolve step
    # rejects fork PRs before any head content is touched.
    types: [closed]
    branches: ["bugfix-v*", "bugfix-release/**"]
  workflow_dispatch:
    inputs:
      fast:
        description: "EMERGENCY fast publish: skip the full-CI dispatch/gate and the full npm test. Keeps every version guard + npm ci + typecheck + build. Owner-owned risk (opened 2026-10-17 to unblock v0.1.199 when CI flakes stall the normal channel)."
        type: boolean
        default: false

concurrency:
  group: bugfix-release
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
      actions: write
      pull-requests: write  # annotate the merged lane PR + auto-open the alignment PR
    steps:
      - name: Validate trigger + resolve the publish ref
        id: resolve
        run: |
          if [ "$GITHUB_EVENT_NAME" = "pull_request" ]; then
            # LEGACY one-off carve-out: PR against master whose head is the
            # carve-out branch. Publishes the PRE-MERGE head on merge.
            MERGED="$(jq -r '.pull_request.merged' "$GITHUB_EVENT_PATH")"
            BRANCH="$(jq -r '.pull_request.head.ref' "$GITHUB_EVENT_PATH")"
            SAME_REPO="$(jq -r '(.pull_request.base.repo.full_name == .pull_request.head.repo.full_name)' "$GITHUB_EVENT_PATH")"
            SHA="$(jq -r '.pull_request.head.sha' "$GITHUB_EVENT_PATH")"
            if [ "$MERGED" != "true" ]; then
              echo "::notice::PR $GITHUB_EVENT_NUMBER closed without merging — nothing to publish"
              exit 0
            fi
            case "$BRANCH" in
              bugfix-release/*) ;; # legacy one-off carve-out
              *)
                echo "::notice::head branch '$BRANCH' is not a legacy bugfix-release/* carve-out — nothing to publish"
                exit 0
                ;;
            esac
            if [ "$SAME_REPO" != "true" ]; then
              echo "::error::fork PRs cannot use the carve-out channel (repo secrets are unavailable for them)"
              exit 1
            fi
          elif [ "$GITHUB_EVENT_NAME" = "pull_request_target" ]; then
            # v2 merge-gated lane publish: a REVIEWED PR was merged into a
            # patch lane. Publish the POST-MERGE lane head (== merge sha).
            MERGED="$(jq -r '.pull_request.merged' "$GITHUB_EVENT_PATH")"
            STATE="$(jq -r '.pull_request.state' "$GITHUB_EVENT_PATH")"
            BRANCH="$(jq -r '.pull_request.base.ref' "$GITHUB_EVENT_PATH")"
            SHA="$(jq -r '.pull_request.merge_commit_sha' "$GITHUB_EVENT_PATH")"
            SAME_REPO="$(jq -r '(.pull_request.base.repo.full_name == .pull_request.head.repo.full_name)' "$GITHUB_EVENT_PATH")"
            if [ "$STATE" != "closed" ] || [ "$MERGED" != "true" ]; then
              echo "::notice::PR $GITHUB_EVENT_NUMBER is '$STATE' (merged=$MERGED) — only MERGES into a lane publish"
              exit 0
            fi
            case "$BRANCH" in
              bugfix-v*) ;; # protected patch lane (v2 model)
              bugfix-release/*) ;; # same treatment for lane-shaped targets
              *)
                echo "::notice::base branch '$BRANCH' is not a patch lane — nothing to publish"
                exit 0
                ;;
            esac
            if [ "$SAME_REPO" != "true" ]; then
              echo "::error::fork PRs cannot use the lane publish channel (repo secrets are unavailable for them)"
              exit 1
            fi
          else
            BRANCH="$GITHUB_REF_NAME"
            SHA=""
          fi
          echo "branch=$BRANCH" >> "$GITHUB_OUTPUT"
          echo "sha=$SHA" >> "$GITHUB_OUTPUT"
          echo "proceed=true" >> "$GITHUB_OUTPUT"

      - name: Checkout
        if: steps.resolve.outputs.proceed == 'true'
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Switch to the publish tree (post-merge lane head / legacy pre-merge head)
        # v2: publish the EXACT reviewed state — the merge sha of the PR that
        # just landed in the lane. Legacy: pre-merge head of a merged
        # carve-out PR. If the lane head has already moved past the merge sha
        # (another PR landed first while this run queued behind it under the
        # concurrency group), warn loudly and still publish the reviewed sha;
        # the newer content rides the next release.
        if: steps.resolve.outputs.proceed == 'true' && (github.event_name == 'pull_request' || github.event_name == 'pull_request_target')
        run: |
          SHA="${{ steps.resolve.outputs.sha }}"
          BRANCH="${{ steps.resolve.outputs.branch }}"
          git rev-parse --verify --quiet "${SHA}^{commit}" >/dev/null || git fetch origin "$SHA"
          LIVE_HEAD="$(git ls-remote origin "refs/heads/$BRANCH" | awk '{print $1}')"
          if [ -n "$LIVE_HEAD" ] && [ "$LIVE_HEAD" != "$(git rev-parse ${SHA}^{commit})" ]; then
            echo "::warning::lane '$BRANCH' head ($LIVE_HEAD) differs from the merge sha ($SHA) — publishing the reviewed merge sha anyway; newer lane content will ride the NEXT release"
          fi
          git checkout --detach "$SHA"

      - uses: actions/setup-node@v4
        if: steps.resolve.outputs.proceed == 'true'
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org

      - name: Read version
        id: version
        if: steps.resolve.outputs.proceed == 'true'
        run: |
          V="$(node -p "require('./package.json').version")"
          case "$V" in
            0.0.*)
              echo "::error::package.json version $V is below 0.1.0 — official releases must always sort above the 0.0.x PR-build line (#1385)"
              exit 1
              ;;
          esac
          echo "version=$V" >> $GITHUB_OUTPUT
          REF="${{ steps.resolve.outputs.branch }}"
          SHA="${{ steps.resolve.outputs.sha }}"
          [ -z "$SHA" ] && SHA="$(git rev-parse HEAD)"
          echo "::notice::Publishing carve-out from '$REF' @ ${SHA:0:12} -> v$V (master NOT involved)"

      - name: Check plugin manifest versions (#4449)
        # Same gate as release.yml: the publish tree is a frozen lane state
        # (last tag + carried fixes + bump), so it must ALREADY carry the
        # synced plugin manifests — drift fails fast here instead of shipping
        # a release whose marketplace update detection never fires. See
        # reference/release.md.
        if: steps.resolve.outputs.proceed == 'true'
        # #4576 follow-up: lanes cut from a pre-#4449 tag do not carry the
        # manifest sync script at all -- fail-open with a notice there instead
        # of MODULE_NOT_FOUND (same existence-guard philosophy as release-manual's
        # lane guard).
        run: |
          if [ -f scripts/sync-codex-plugin-version.mjs ]; then
            node scripts/sync-codex-plugin-version.mjs --check
          else
            echo "::notice::this tree predates #4449 (no scripts/sync-codex-plugin-version.mjs) — manifest sync check skipped for the pre-#4449 lane"
          fi

      - name: Publish guard (monotonic + not-already-live)
        if: steps.resolve.outputs.proceed == 'true'
        run: |
          VER="${{ steps.version.outputs.version }}"
          LATEST="$(npm view billion-context version)"
          if [ -z "$LATEST" ]; then
            echo "::error::cannot read npm latest for billion-context"; exit 1
          fi
          LIVE="$(npm view "billion-context@$VER" version 2>/dev/null || true)"
          if [ "$LIVE" = "$VER" ]; then
            echo "::error::$VER is already published on npm; pick a newer version"; exit 1
          fi
          node -e '
            const base = (s) => s.split("-")[0].split(".").map(Number);
            const cmp = (a,b) => { for (let i=0;i<3;i++){ if(a[i]!==b[i]) return a[i]-b[i]; } return 0; };
            const v = process.argv[1], l = process.argv[2];
            const c = cmp(base(v), base(l));
            if (c <= 0) { console.error("::error::target " + v + " is not strictly newer than npm latest " + l + " — refusing to hold/downgrade latest"); process.exit(1); }
            console.log("guard ok: " + v + " > latest " + l);
          ' "$VER" "$LATEST"

      - name: Verify release-notes entry (#1870)
        # Policy (2026-10-04 revision of #1870): entries are OPT-IN severity
        # declarations — only severe releases need one; ordinary releases ship
        # silently with NO entry. Missing entry => notice + pass; present
        # entry => validated and logged.
        if: steps.resolve.outputs.proceed == 'true'
        run: |
          VER="${{ steps.version.outputs.version }}"
          case "$VER" in
            *-*) echo "prerelease $VER — release-notes gate skipped"; exit 0 ;;
          esac
          node -e "
            const notes = require('./release-notes/package.json').billionContextReleaseNotes;
            const entry = notes && notes.releases && notes.releases.find((e) => e.version === process.argv[1]);
            if (!entry) {
              console.log('::notice::release ' + process.argv[1] + ' has no release-notes entry — shipping silently (entries are opt-in; only severe releases need one). See release-notes/README.md (#1870).');
              process.exit(0);
            }
            console.log('release-notes entry ok:', entry.version, '[' + entry.tier + ']', entry.summary.slice(0, 80));
          " "$VER"

      - name: Full CI dispatch (all lanes, publish sha)
        # Policy (2026-10-10, after the v0.1.192 carve-out): every release
        # channel must run the COMPLETE CI set at the exact publish sha before
        # npm publish. For a v2 lane publish the merge sha is brand-new (PR-era
        # lane runs sit on earlier shas), so the gate dispatches the missing
        # lanes here; idempotent where runs already exist.
        # EMERGENCY fast mode (owner 2026-10-17): dispatch is already a
        # human-picked ref; with fast=true the human explicitly owns skipping
        # this lane matrix — version guards and the build sanity below still
        # run.
        if: steps.resolve.outputs.proceed == 'true' && inputs.fast != true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          GITHUB_SHA="${{ steps.resolve.outputs.sha }}"
          [ -z "$GITHUB_SHA" ] && GITHUB_SHA="$(git rev-parse HEAD)"
          export GITHUB_SHA
          export GITHUB_REF_NAME="${{ steps.resolve.outputs.branch }}"
          node scripts/release-ci-gate.mjs --dispatch

      - name: Pre-flight gate (full suite)
        # keep the claude-native live e2e subtests in this pre-publish gate (#1248)
        if: steps.resolve.outputs.proceed == 'true' && inputs.fast != true
        env:
          ACP_TEST_CLAUDE_NATIVE: "1"
        run: |
          npm ci
          npm run typecheck
          npm test
          npm run build

      - name: Pre-flight gate (fast mode — build sanity only)
        # EMERGENCY fast mode: keep the cheap sanity (install/typecheck/build)
        # so a broken tree still fails loudly, but skip the full npm test —
        # the lane matrix above was skipped by explicit human choice.
        if: steps.resolve.outputs.proceed == 'true' && inputs.fast == true
        run: |
          echo "::warning::FAST MODE — full CI lanes and the full npm test were SKIPPED by an explicit human choice (workflow_dispatch fast=true). Publish sanity = version guards + npm ci + typecheck + build only."
          npm ci
          npm run typecheck
          npm run build

      - name: Full CI gate (all lanes green at this sha)
        # Hard precondition for publish: lanes dispatched above (plus any PR-era
        # lane runs already at this sha) ran in parallel with the pre-flight;
        # wait them out now. Any red lane or timeout ⇒ release fails, nothing
        # is published.
        if: steps.resolve.outputs.proceed == 'true' && inputs.fast != true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CI_GATE_TIMEOUT_MIN: "60"
        run: |
          GITHUB_SHA="${{ steps.resolve.outputs.sha }}"
          [ -z "$GITHUB_SHA" ] && GITHUB_SHA="$(git rev-parse HEAD)"
          export GITHUB_SHA
          export GITHUB_REF_NAME="${{ steps.resolve.outputs.branch }}"
          node scripts/release-ci-gate.mjs --wait

      - name: Check if prerelease
        id: pre
        if: steps.resolve.outputs.proceed == 'true'
        run: |
          if echo "${{ steps.version.outputs.version }}" | grep -q '-'; then
            echo "tag=dev" >> $GITHUB_OUTPUT
            echo "prerelease=true" >> $GITHUB_OUTPUT
          else
            echo "tag=latest" >> $GITHUB_OUTPUT
            echo "prerelease=false" >> $GITHUB_OUTPUT
          fi

      - name: Create tag
        if: steps.resolve.outputs.proceed == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git tag "v${{ steps.version.outputs.version }}" || true
          git push origin "v${{ steps.version.outputs.version }}" || true

      - name: Publish
        if: steps.resolve.outputs.proceed == 'true'
        run: npm publish --tag ${{ steps.pre.outputs.tag }} --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Annotate the merged lane PR (audit trail)
        # Merge-gated lane publish: the carrying PR is already merged; leave
        # the audit trail on it so a later reader sees publish == that merge.
        if: github.event_name == 'pull_request_target' && steps.resolve.outputs.proceed == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh pr comment "$GITHUB_EVENT_NUMBER" --body "Published v${{ steps.version.outputs.version }} from the POST-MERGE lane head \`${{ steps.resolve.outputs.sha }}\` (merge-gated lane publish, v2 flow). Master alignment follows via the auto-opened PR." \
            || echo "::notice::could not annotate PR $GITHUB_EVENT_NUMBER (non-fatal)"

      - name: Create GitHub Release
        if: steps.resolve.outputs.proceed == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          VER="${{ steps.version.outputs.version }}"
          # nearest ancestor tag other than the one we just made (=> v0.1.181 for this carve-out)
          LAST="$(git describe --match 'v*' --exclude "v$VER*" --tags --abbrev=0 2>/dev/null || echo "")"
          NOTES="$RUNNER_TEMP/release-notes.md"
          if [ -n "$LAST" ] && [ "$LAST" != "v$VER" ]; then
            {
              echo "## Changes since $LAST"
              ""
              git log --no-merges --pretty='- %s' "$LAST..HEAD"
            } > "$NOTES"
          else
            echo "- initial release" > "$NOTES"
          fi
          node -e '
            const fs = require("fs");
            const [notesFile, ver, prerelease, out] = process.argv.slice(1);
            const body = {
              tag_name: "v" + ver,
              name: "v" + ver,
              prerelease: prerelease === "true",
              body: fs.readFileSync(notesFile, "utf8").trim()
            };
            fs.writeFileSync(out, JSON.stringify(body));
          ' "$NOTES" "$VER" "${{ steps.pre.outputs.prerelease }}" "$RUNNER_TEMP/release.json"
          curl -sS -f -X POST \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            -H "Content-Type: application/json" \
            "https://api.github.com/repos/${{ github.repository }}/releases" \
            -d @"$RUNNER_TEMP/release.json"

      - name: Open the alignment PR into master (cycle stage 5)
        # v2 flow: right after a successful lane publish, open a dedicated
        # alignment PR (lane -> master) so master picks up the shipped content
        # (incl. the version bump). Structural conflicts vs master are EXPECTED
        # (the lane is based on an older tag while master moved on): resolve
        # master-first, keeping only lane-unique content. Merging this PR
        # completes the release cycle. Non-fatal: a failed open is flagged and
        # the PR can be opened manually.
        if: github.event_name == 'pull_request_target' && steps.resolve.outputs.proceed == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          LANE="${{ steps.resolve.outputs.branch }}"
          VER="${{ steps.version.outputs.version }}"
          OPEN_PRS="$(gh pr list --base master --head "$LANE" --state open --json number 2>/dev/null | jq 'length')"
          if [ "${OPEN_PRS:-0}" -gt 0 ]; then
            echo "::notice::an alignment PR ($LANE -> master) is already open — leaving it as-is"
          else
            gh pr create --base master --head "$LANE" \
              --title "align master with v$VER (shipped from $LANE)" \
              --body "Auto-opened by Bugfix Release right after v$VER shipped from \`$LANE\` (post-merge sha \`${{ steps.resolve.outputs.sha }}\`). Structural conflicts vs master are EXPECTED — the lane is based on an older tag while master moved on; resolve master-first, keeping only lane-unique content (release notes, advisories, diagnostics). Merging this PR completes the release cycle." \
              || echo "::warning::could not open the alignment PR automatically — open it manually: base=master head=$LANE (non-fatal)"
          fi

      - name: Close the patch-lane cycle (notice — the state is derived, nothing to clear)
        # Lanes derive from the latest released tag: once this publish creates
        # vNEXT, the NEXT lane is cut FRESH from vNEXT (one-click / manual
        # cut). Nothing is stored, nothing to reset; the old lane stays frozen
        # as the record of what shipped.
        if: steps.resolve.outputs.proceed == 'true'
        run: |
          BRANCH="${{ steps.resolve.outputs.branch }}"
          echo "::notice::shipped '$BRANCH' — the fresh tag closes this lane cycle by derivation; the next lane is cut from it (aligned back to master via the auto-opened PR)"
