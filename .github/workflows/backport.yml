name: Backport

# Dual-lane release model (owner-approved 2026-10-24): the patch train.
#
# Small fixes merge to master as ordinary PRs (nothing about the normal lane
# changes). When the human wants a fix to ALSO ride the fast patch lane, they
# add the `backport` label BEFORE clicking merge: this workflow then
# cherry-picks the PR's own commits onto the standing patch train — a
# bugfix-release/** branch cut from the last released TAG — so a patch release
# ships tag+fixes ONLY, never master's unreleased features (the #2011
# carve-out contract, extended from one fix per branch to a standing train).
#
# Why cherry-pick and not a merge of the fix branch: the fix branch is based
# on master, so a git merge into the tag-based train would carry EVERY master
# commit since the tag (the unreleased features) over the merge-base — the
# exact leak this lane exists to prevent. Cherry-pick moves exactly the fix
# commits.
#
# Train selection: the repository Actions variable BACKPORT_TRAIN holds the
# current train's full branch name (set when the train is cut, cleared after
# it ships). No variable / no open train -> the label is a no-op with a PR
# comment (the fix stays on the master lane, nothing is lost or queued).
#
# CI signal on the train (#772): pushes made with GITHUB_TOKEN deliver NO
# push events, so this workflow explicitly dispatches the CI workflow on the
# train ref after pushing — every backported state gets a CORE-matrix signal.
# Shipping is separately gated: release-bugfix.yml dispatches the FULL matrix
# at the train PR head before publish.
#
# Conflict policy: a cherry-pick that does not apply cleanly is the objective
# signal that the fix is NOT independent of master's unreleased work — the
# workflow comments the manual command on the PR and fails; the fix simply
# stays on the master (slow) lane.

on:
  pull_request:
    types: [closed]
    branches: [master]

permissions:
  contents: write
  pull-requests: write
  actions: write

# Serialize train updates: two backports landing together would race on the
# train ref. Queued (not cancelled) — every labeled merge eventually lands.
concurrency:
  group: backport
  cancel-in-progress: false

jobs:
  backport:
    if: github.event.pull_request.merged == true
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
      PR_NUMBER: ${{ github.event.pull_request.number }}
      PR_TITLE: ${{ github.event.pull_request.title }}
      TRAIN: ${{ vars.BACKPORT_TRAIN }}
    steps:
      - name: Gate — merged with the backport label
        id: gate
        run: |
          set -euo pipefail
          LABELS="$(jq -r '.pull_request.labels[].name' "$GITHUB_EVENT_PATH" | sort | tr '\n' ' ')"
          echo "labels: $LABELS"
          if grep -qw backport <<<"$LABELS"; then
            echo "labeled=true" >> "$GITHUB_OUTPUT"
          else
            echo "labeled=false" >> "$GITHUB_OUTPUT"
            echo "::notice::no backport label — master lane only, nothing to do"
          fi

      - name: No train configured — tell the thread, lose nothing
        if: steps.gate.outputs.labeled == 'true' && env.TRAIN == ''
        run: |
          set -euo pipefail
          gh pr comment "$PR_NUMBER" --body "The \`backport\` label was set, but no patch train is configured (repository variable \`BACKPORT_TRAIN\` is empty — no train is open). The fix stays on the master lane and ships with the next regular release. To put it on a train, cut one (\`reference/release.md\`, \"Dual-lane releases\") and cherry-pick ${GITHUB_SHA:0:10} manually." || true
          echo "::notice::BACKPORT_TRAIN is empty — label recorded on the PR, no train to update"

      - name: Checkout
        if: steps.gate.outputs.labeled == 'true' && env.TRAIN != ''
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Resolve and verify the train branch
        if: steps.gate.outputs.labeled == 'true' && env.TRAIN != ''
        run: |
          set -euo pipefail
          case "$TRAIN" in
            bugfix-release/*) ;;
            *) echo "::error::BACKPORT_TRAIN='$TRAIN' does not start with bugfix-release/ — refusing to touch any other branch"; exit 1 ;;
          esac
          if ! git ls-remote --exit-code --heads origin "$TRAIN" >/dev/null; then
            echo "::error::BACKPORT_TRAIN='$TRAIN' does not exist on origin — stale variable? Fix or clear it in repository settings (Variables)."
            exit 1
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Cherry-pick the PR commits onto the train
        if: steps.gate.outputs.labeled == 'true' && env.TRAIN != '' && !failure()
        run: |
          set -euo pipefail
          MERGE_SHA="$(jq -r '.pull_request.merge_commit_sha' "$GITHUB_EVENT_PATH")"
          PARENTS="$(git rev-list --parents -n1 "$MERGE_SHA" | wc -w)"
          git checkout --quiet -B train "origin/$TRAIN"
          if [ "$PARENTS" -ge 3 ]; then
            # Merge-commit PR (this repo's convention): parent1..parent2 is
            # exactly the PR's own commits.
            RANGE="${MERGE_SHA}^1..${MERGE_SHA}^2"
            echo "cherry-picking merge range: $RANGE"
            git cherry-pick -x "$RANGE"
          else
            # Squash-style single-commit merge: the merge commit itself is
            # the whole PR. (Rebase-merges are not supported — see the
            # conflict policy in the workflow header.)
            echo "single-parent merge (squash) — cherry-picking the merge commit itself"
            git cherry-pick -x "$MERGE_SHA"
          fi
          git push origin HEAD:"$TRAIN"

      - name: Dispatch CI on the train head (#772 — token pushes carry no push events)
        if: steps.gate.outputs.labeled == 'true' && env.TRAIN != '' && !failure()
        run: |
          set -euo pipefail
          gh workflow run CI --ref "$TRAIN"
          echo "::notice::CI dispatched on $TRAIN (CORE matrix)"

      - name: Audit trail comment
        if: steps.gate.outputs.labeled == 'true' && env.TRAIN != '' && success()
        run: gh pr comment "$PR_NUMBER" --body "Backported to \`$TRAIN\` (cherry-pick) and CI dispatched on the train head. Patch release will ship it from the tag-based train — master's unreleased work stays out." || true

      - name: Conflict breadcrumb — manual backport needed
        if: steps.gate.outputs.labeled == 'true' && env.TRAIN != '' && failure()
        run: |
          set -euo pipefail
          MERGE_SHA="$(jq -r '.pull_request.merge_commit_sha' "$GITHUB_EVENT_PATH")"
          gh pr comment "$PR_NUMBER" --body "Backport to \`$TRAIN\` failed — either the cherry-pick conflicts (the fix is NOT independent of master's unreleased work) or the train variable/branch is misconfigured (see the job log). The fix stays on the master (slow) lane either way. To force it onto the train, resolve manually: \`git checkout $TRAIN && git cherry-pick -x ${MERGE_SHA}^1..${MERGE_SHA}^2\`." || true
