name: Backport

# Dual-lane release model (owner-approved 2026-10-24): the patch train.
#
# Small fixes merge to master as ordinary PRs (nothing about the normal lane
# changes). When the human wants a fix to ALSO ride the fast patch lane, they
# add the `backport` label BEFORE clicking merge — that label is the ONLY
# manual step. This workflow then manages the train end to end:
#
#   - no train open  -> CUT one automatically: bugfix-release/v{NEXT}-train
#                       from the latest released v* tag (NEXT = patch+1), set
#                       the BACKPORT_TRAIN variable, then backport;
#   - train open     -> cherry-pick the PR's own commits onto it;
#   - after shipping -> release-bugfix.yml clears BACKPORT_TRAIN (when the
#                       shipped branch is the train), so the next labeled
#                       merge cuts the next train. Fully automatic lifecycle.
#
# Why a fresh train per cycle instead of one fixed branch: each train is born
# from a tag, so its content is STRUCTURALLY "tag + fixes" — an accidental
# master merge or leftover commits can never poison future patch releases,
# and an abandoned cycle leaves no state behind.
#
# Why cherry-pick and not a merge of the fix branch: the fix branch is based
# on master, so a git merge into the tag-based train would carry EVERY master
# commit since the tag (the unreleased features) over the merge-base — the
# exact leak this lane exists to prevent.
#
# CI signal on the train (#772): pushes made with GITHUB_TOKEN deliver NO
# push events, so this workflow explicitly dispatches the CI workflow on the
# train ref after pushing. Shipping is separately gated: release-bugfix.yml
# dispatches the FULL matrix at the train PR head before publish.
#
# Conflict policy: a cherry-pick that does not apply cleanly is the objective
# signal that the fix is NOT independent of master's unreleased work — the
# workflow comments the manual command on the PR and the fix simply stays on
# the master (slow) lane.
#
# The train name is read fresh from the API in every step (not the vars
# context at dispatch time): serialized runs must observe the train the
# previous run just cut/updated.

on:
  pull_request:
    types: [closed]
    branches: [master]

permissions:
  contents: write
  pull-requests: write
  actions: write

# Serialize train updates: two backports landing together would race on the
# train ref. Queued (not cancelled) — every labeled merge eventually lands.
concurrency:
  group: backport
  cancel-in-progress: false

jobs:
  backport:
    if: github.event.pull_request.merged == true
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
      PR_NUMBER: ${{ github.event.pull_request.number }}
    steps:
      - name: Gate — merged with the backport label
        id: gate
        run: |
          set -euo pipefail
          LABELS="$(jq -r '.pull_request.labels[].name' "$GITHUB_EVENT_PATH" | sort | tr '\n' ' ')"
          echo "labels: $LABELS"
          if grep -qw backport <<<"$LABELS"; then
            echo "labeled=true" >> "$GITHUB_OUTPUT"
          else
            echo "labeled=false" >> "$GITHUB_OUTPUT"
            echo "::notice::no backport label — master lane only, nothing to do"
          fi

      - name: Resolve the train (fresh read; auto-cut if none is open)
        id: resolve
        if: steps.gate.outputs.labeled == 'true'
        run: |
          set -euo pipefail
          TRAIN="$(gh api repos/${GITHUB_REPOSITORY}/actions/variables/BACKPORT_TRAIN --jq .value 2>/dev/null || true)"
          if [ -n "$TRAIN" ]; then
            case "$TRAIN" in
              bugfix-release/*) ;;
              *) echo "::error::BACKPORT_TRAIN='$TRAIN' does not start with bugfix-release/ — refusing to touch any other branch"; exit 1 ;;
            esac
            if ! git ls-remote --exit-code --heads "https://github.com/${GITHUB_REPOSITORY}.git" "$TRAIN" >/dev/null 2>&1; then
              echo "::error::BACKPORT_TRAIN='$TRAIN' does not exist on origin — stale variable? Clear it (gh api -X DELETE repos/${GITHUB_REPOSITORY}/actions/variables/BACKPORT_TRAIN) so the next backport cuts a fresh train."
              exit 1
            fi
            echo "train=$TRAIN" >> "$GITHUB_OUTPUT"
            echo "mode=pick" >> "$GITHUB_OUTPUT"
            echo "open train: $TRAIN"
          else
            # No train open — the next one is cut from the latest bili tag.
            echo "mode=cut" >> "$GITHUB_OUTPUT"
            echo "no open train — will cut one automatically"
          fi

      - name: Checkout (full history + tags)
        if: steps.gate.outputs.labeled == 'true'
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          fetch-tags: true

      - name: Cut a fresh train from the latest released tag
        id: cut
        if: steps.gate.outputs.labeled == 'true' && steps.resolve.outputs.mode == 'cut'
        run: |
          set -euo pipefail
          LAST="$(git tag --list 'v*' --sort=-v:refname | head -1)"
          if [ -z "$LAST" ]; then echo "::error::no v* tags found — cannot base a train"; exit 1; fi
          BASE="${LAST#v}"
          IFS='.' read -r MA MI PA <<<"$BASE"
          NEXT="$MA.$MI.$((PA + 1))"
          TRAIN="bugfix-release/v${NEXT}-train"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout --quiet -b "$TRAIN" "$LAST"
          git push origin "$TRAIN"
          gh api -X PUT "repos/${GITHUB_REPOSITORY}/actions/variables/BACKPORT_TRAIN" -f name=BACKPORT_TRAIN -f value="$TRAIN"
          echo "train=$TRAIN" >> "$GITHUB_OUTPUT"
          echo "cut $TRAIN from $LAST (next patch: v$NEXT)"
          gh pr comment "$PR_NUMBER" --body "No patch train was open — cut \`$TRAIN\` from \`$LAST\` automatically and backporting this fix onto it. Ship it any time: release commit on the train + PR against master (\`reference/release.md\`, \"Dual-lane releases\")." || true

      - name: Cherry-pick the PR commits onto the train
        if: steps.gate.outputs.labeled == 'true' && !failure()
        env:
          TRAIN: ${{ steps.resolve.outputs.mode == 'pick' && steps.resolve.outputs.train || steps.cut.outputs.train }}
        run: |
          set -euo pipefail
          case "$TRAIN" in
            bugfix-release/*) ;;
            *) echo "::error::internal: no train resolved"; exit 1 ;;
          esac
          MERGE_SHA="$(jq -r '.pull_request.merge_commit_sha' "$GITHUB_EVENT_PATH")"
          PARENTS="$(git rev-list --parents -n1 "$MERGE_SHA" | wc -w)"
          if ! git rev-parse --verify --quiet "origin/$TRAIN" >/dev/null; then
            git fetch origin "$TRAIN"
          fi
          git checkout --quiet -B train "origin/$TRAIN"
          if [ "$PARENTS" -ge 3 ]; then
            # Merge-commit PR (this repo's convention): parent1..parent2 is
            # exactly the PR's own commits.
            RANGE="${MERGE_SHA}^1..${MERGE_SHA}^2"
            echo "cherry-picking merge range: $RANGE"
            git cherry-pick -x "$RANGE"
          else
            # Squash-style single-commit merge: the merge commit itself is
            # the whole PR. (Rebase-merges are not supported — see the
            # conflict policy in the workflow header.)
            echo "single-parent merge (squash) — cherry-picking the merge commit itself"
            git cherry-pick -x "$MERGE_SHA"
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git push origin HEAD:"$TRAIN"

      - name: Dispatch CI on the train head (#772 — token pushes carry no push events)
        if: steps.gate.outputs.labeled == 'true' && !failure()
        env:
          TRAIN: ${{ steps.resolve.outputs.mode == 'pick' && steps.resolve.outputs.train || steps.cut.outputs.train }}
        run: |
          set -euo pipefail
          gh workflow run CI --ref "$TRAIN"
          echo "::notice::CI dispatched on $TRAIN (CORE matrix)"

      - name: Audit trail comment
        if: steps.gate.outputs.labeled == 'true' && !failure() && success()
        env:
          TRAIN: ${{ steps.resolve.outputs.mode == 'pick' && steps.resolve.outputs.train || steps.cut.outputs.train }}
        run: gh pr comment "$PR_NUMBER" --body "Backported to \`$TRAIN\` (cherry-pick) and CI dispatched on the train head. Patch release will ship it from the tag-based train — master's unreleased work stays out." || true

      - name: Conflict breadcrumb — manual backport needed
        if: steps.gate.outputs.labeled == 'true' && failure()
        env:
          TRAIN: ${{ steps.resolve.outputs.mode == 'pick' && steps.resolve.outputs.train || steps.cut.outputs.train }}
        run: |
          set -euo pipefail
          MERGE_SHA="$(jq -r '.pull_request.merge_commit_sha' "$GITHUB_EVENT_PATH")"
          gh pr comment "$PR_NUMBER" --body "Backport failed${TRAIN:+ to \`$TRAIN\`} — either the cherry-pick conflicts (the fix is NOT independent of master's unreleased work) or the train is misconfigured (see the job log). The fix stays on the master (slow) lane either way. To force it onto a train, resolve manually: \`git checkout $TRAIN && git cherry-pick -x ${MERGE_SHA}^1..${MERGE_SHA}^2\`." || true
